<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Лаборатория Uniqore</title>
<link rel="stylesheet" href="/css/fonts.css?v=20260731b">
<style>
:root{--bg:#0A0E1A;--ink:#EEF1F6;--mut:#8792a3;--line:rgba(255,255,255,.08);--lime:#CDFF4F}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;min-height:100vh;padding:80px 24px;display:flex;flex-direction:column;align-items:center;gap:28px}
h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--lime)}
p{color:var(--mut);font-size:15px;max-width:56ch;text-align:center}
.grid{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin-top:20px}
a.card{display:block;padding:18px 22px;border-radius:14px;background:#0f131f;border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:border-color .2s ease,transform .2s ease}
a.card:hover{border-color:rgba(205,255,79,.35);transform:translateY(-2px)}
a.card b{font-family:'Unbounded',sans-serif;font-size:16px;letter-spacing:-.01em}
a.card span{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
</style>
</head>
<body>
<h1>Лаборатория <em>Uniqore</em></h1>
<p>Закрытые черновики — не индексируются, не для клиентов. Смотрит только Матвей до одобрения.</p>
<div class="grid">
  <a class="card" href="/lab/konfigurator/"><b>Конфигуратор цены v4</b><span>Пресеты, категории допов, тариф 60к, 3D — в разработке</span></a>
</div>
</body>
</html>
